server:
  port: 8080

spring:
  application:
    name: pwct-api
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:AppPass123}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

app:
  jwt:
    secret: ${JWT_SECRET:oYtY0o4mWmAHROrEboUVhj2P429Dd8y8U7+CIJ/OK6s=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200}
  notifications:
    email-enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
    from: ${MAIL_FROM:no-reply@pwct.local}
  storage:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}

spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 6MB
